name: Build and Publish APK (V2)

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version tag'
        required: false
        default: 'v1.0.0'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Restore dependencies
        run: dotnet restore V2/CountdownToUs.csproj -p:TargetFrameworks=net10.0-android

      - name: Publish Android APK
        run: >-
          dotnet publish V2/CountdownToUs.csproj
          --configuration Release
          --framework net10.0-android
          --no-restore
          -p:AndroidPackageFormats=apk
          -p:AndroidKeyStore=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: countdown-android-apk
          path: V2/bin/Release/net10.0-android/**/*.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: build-android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: countdown-android-apk
          path: apks/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_version || github.ref_name }}
          name: CountdownToUs APK ${{ inputs.release_version || github.ref_name }}
          body: |
            ## CountdownToUs Android APK

            Built from commit `${{ github.sha }}`.
          files: apks/**/*.apk
          fail_on_unmatched_files: true

  publish-google-play:
    name: Publish to Google Play Store
    needs: build-android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      GOOGLE_PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check Google Play signing secrets
        id: secrets-check
        shell: bash
        run: |
          if [[ -n "$GOOGLE_PLAY_JSON" && -n "$ANDROID_KEYSTORE_BASE64" && \
                -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && \
                -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Google Play upload skipped: configure the documented signing and service-account secrets."
          fi

      - name: Checkout repository
        if: steps.secrets-check.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        if: steps.secrets-check.outputs.configured == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java JDK
        if: steps.secrets-check.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install MAUI Android workload
        if: steps.secrets-check.outputs.configured == 'true'
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Restore Android dependencies
        if: steps.secrets-check.outputs.configured == 'true'
        run: dotnet restore V2/CountdownToUs.csproj -p:TargetFrameworks=net10.0-android

      - name: Decode Android signing keystore
        if: steps.secrets-check.outputs.configured == 'true'
        shell: bash
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/countdown-upload.keystore"

      - name: Build signed Android App Bundle
        if: steps.secrets-check.outputs.configured == 'true'
        shell: bash
        run: |
          dotnet publish V2/CountdownToUs.csproj \
            --configuration Release \
            --framework net10.0-android \
            --no-restore \
            -p:AndroidPackageFormats=aab \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$GITHUB_WORKSPACE/countdown-upload.keystore" \
            -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD" \
            -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD"

      - name: Publish to Google Play Store
        if: steps.secrets-check.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.companyname.countdowntous
          releaseFiles: V2/bin/Release/net10.0-android/publish/*.aab
          track: internal
          status: inprogress
