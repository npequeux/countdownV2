name: Build and Publish APK

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'V2/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'V2/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (android)'
        required: true
        default: 'android'

env:
  SOLUTION_FILE_PATH: V2/V2.sln
  APP_NAME: CountdownV2
  VERSION_SUFFIX: ''

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Android workload
        run: |
          dotnet workload install maui-android --source https://dotnet.myget.org/F/microsoft-maui/feed/api/v3/index.json || true

      - name: Restore dependencies
        run: |
          cd V2
          dotnet restore

      - name: Build Android APK (Debug)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug'
        run: |
          cd V2
          dotnet publish --configuration Debug `
            --framework net8.0-android `
            /p:PublishSingleFile=true `
            /p:SelfContained=false `
            /p:AndroidSdkVersion=34.0.0 `
            /p:AndroidNdkPath="$HOME/.nuget/packages/androidndk-r25d" `
            /p:AndroidUseAot=false

      - name: Build Android APK (Release)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'release'
        run: |
          cd V2
          dotnet publish --configuration Release `
            --framework net8.0-android `
            /p:PublishSingleFile=true `
            /p:SelfContained=false `
            /p:AndroidSdkVersion=34.0.0 `
            /p:AndroidNdkPath="$HOME/.nuget/packages/androidndk-r25d" `
            /p:AndroidUseAot=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CountdownV2-APK-${{ github.sha }}
          path: |
            V2/bin/Debug/net8.0-android/**/*.apk
            V2/bin/Release/net8.0-android/**/*.apk
          if-no-files-found: ignore

      - name: Upload aar artifact (for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: CountdownV2-AAR-${{ github.sha }}
          path: |
            V2/bin/Debug/net8.0-android/**/*.aar
            V2/bin/Release/net8.0-android/**/*.aar
          if-no-files-found: ignore

      - name: Upload map file artifact (for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: CountdownV2-MAP-${{ github.sha }}
          path: |
            V2/bin/Debug/net8.0-android/**/*.map
            V2/bin/Release/net8.0-android/**/*.map
          if-no-files-found: ignore

  publish-github-release:
    name: Create GitHub Release
    needs: build-android-apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: CountdownV2-APK-*
          path: apks/
          merge-multiple: true

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ inputs.release_version || github.ref_name }}
          name: CountdownV2 APK Release - ${{ inputs.release_version || github.ref_name }}
          body: |
            ## Countdown V2 APK Release

            **Version:** ${{ inputs.release_version || github.ref_name }}
            **Build SHA:** ${{ github.sha }}
            **Date:** ${{ github.event.head_commit.message || 'N/A' }}

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v1
        if: steps.create_release.outputs.conclusion == 'success'
        with:
          files: |
            apks/**/*.apk
          tag_name: ${{ inputs.release_version || github.ref_name }}
          name: CountdownV2 APK Release - ${{ inputs.release_version || github.ref_name }}

      - name: Upload AAR to GitHub Release
        uses: softprops/action-gh-release@v1
        if: steps.create_release.outputs.conclusion == 'success'
        with:
          files: |
            apks/**/*.aar
          tag_name: ${{ inputs.release_version || github.ref_name }}
          name: CountdownV2 APK Release - ${{ inputs.release_version || github.ref_name }}

      - name: Upload MAP to GitHub Release
        uses: softprops/action-gh-release@v1
        if: steps.create_release.outputs.conclusion == 'success'
        with:
          files: |
            apks/**/*.map
          tag_name: ${{ inputs.release_version || github.ref_name }}
          name: CountdownV2 APK Release - ${{ inputs.release_version || github.ref_name }}

  publish-google-play:
    name: Publish to Google Play Store
    needs: build-android-apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: CountdownV2-APK-*
          path: apks/
          merge-multiple: true

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Setup Google Play Store credentials
        run: |
          mkdir -p $HOME/google-services
          echo "${{ secrets.GOOGLE_PLAY_JSON }}" > "$HOME/google-services/play-services.json"

      - name: Publish to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_JSON }}
          packageName: com.companyname.countdowntous  # Update with your actual package name
          releaseFiles: |
            apks/**/*.apk
          track: internal
          status: inprogress
